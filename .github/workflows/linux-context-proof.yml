name: Linux Context Proof

on:
  pull_request:
    paths:
      - ".github/workflows/linux-context-proof.yml"
      - "build/cycle-b-spikes/follow-up/linux-runtime-proof/**"

permissions:
  contents: read

jobs:
  llvmpipe-runtime:
    name: Ubuntu llvmpipe runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Mesa runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils
      - name: Run exact-context fixture with llvmpipe
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
        run: >-
          ./gradlew --no-configuration-cache
          -p build/cycle-b-spikes/follow-up/linux-runtime-proof
          linuxX64Test
