name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-linux:
    name: Android and Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test release and policy tooling
        run: >-
          python3 -m unittest discover
          -s tools/tests
          -p 'test_*.py'
          -v
      - name: Check Cycle A repository policy
        run: python3 tools/check_repository_policy.py --root .
      - name: Install Mesa EGL for the Linux GL conformance gate
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgles2
      - name: Test and compile
        run: >-
          ./gradlew --no-configuration-cache
          :kmp:checkKotlinAbi
          :kmp:testAndroidHostTest
          :kmp:linuxX64Test
          :kmp:compileKotlinLinuxArm64
          :kmp:bundleAndroidMainAar

  apple-publication:
    name: Apple and publication metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and test Apple targets and publish locally
        run: >-
          ./gradlew --no-configuration-cache
          :kmp:compileKotlinIosArm64
          :kmp:compileKotlinIosSimulatorArm64
          :kmp:macosArm64Test
          :kmp:publishAllPublicationsToLocalTestRepository
      - name: Resolve aggregate coordinate from clean consumer
        run: |
          smoke_home="$(mktemp -d)"
          ./gradlew --no-configuration-cache \
            --gradle-user-home "$smoke_home" \
            --refresh-dependencies \
            -p consumer-smoke \
            compileAndroidMain \
            compileKotlinIosArm64 \
            compileKotlinIosSimulatorArm64 \
            compileKotlinMacosArm64 \
            compileKotlinLinuxX64 \
            compileKotlinLinuxArm64
