<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RenG WebGL2 demo</title>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #07111d;
    }

    #map {
      display: block;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1;
      max-width: min(520px, calc(100vw - 48px));
      padding: 9px 11px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      color: #dcecff;
      background: rgba(3, 10, 18, 0.82);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      pointer-events: none;
    }

    #status.error {
      color: #ffb6b6;
      border-color: rgba(255, 80, 80, 0.55);
      background: rgba(38, 4, 8, 0.92);
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div id="status">Starting RenG…</div>
  <script src="web-demo.js"></script>
</body>
</html>
